name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Install iOS workload
        run: dotnet workload install ios
      
      - name: Restore
        run: dotnet restore ZumaIOS.iOS.csproj
        working-directory: ${{ github.workspace }}
      
      - name: Build
        run: dotnet build ZumaIOS.iOS.csproj -c Release --no-restore
        working-directory: ${{ github.workspace }}
      
      - name: Create IPA
        run: |
          # The build output should contain the .app bundle
          # Package it as IPA for sideloading
          APP_PATH=$(find . -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found!"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ZumasRevenge.ipa Payload
          echo "IPA created: $(ls -lh ZumasRevenge.ipa)"
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZumasRevenge-IPA
          path: ZumasRevenge.ipa
