name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.404'
      
      - name: Install iOS workload
        run: |
          cp global.json /tmp/
          cd /tmp
          dotnet workload install ios
      
      - name: Build
        run: dotnet build ZumaIOS.iOS.csproj -c Release
      
      - name: Create IPA
        run: |
          APP_PATH=$(find ./bin -name "*.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ZumasRevenge.ipa Payload
          ls -lh ZumasRevenge.ipa
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZumasRevenge-IPA
          path: "ZumasRevenge.ipa"
