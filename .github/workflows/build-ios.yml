name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.404'
      
      - name: Install iOS workload
        run: |
          cd /tmp
          dotnet workload install ios
      
      - name: Build
        run: dotnet build ZumaIOS.iOS.csproj -c Release -p:BuildIpa=true
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZumasRevenge-IPA
          path: "**/*.ipa"
